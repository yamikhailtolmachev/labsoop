<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Операции</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <div class="header-content">
        <div class="header-left">
            <button class="back-btn" onclick="location.href='index.html'">Назад</button>
        </div>
        <div class="header-center">
            <h1>Операции</h1>
        </div>
        <div class="header-right">
            <div class="theme-controls">
                <span class="theme-label">Тёмная тема</span>
                <div id="theme-toggle" class="theme-toggle"></div>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <section class="centered-section">
        <h2>Выберите две функции</h2>
        <div class="form-section">
            <label>Функция A:
                <select id="funcA"></select>
            </label>
            <label>Функция B:
                <select id="funcB"></select>
            </label>
            <button class="centered-button" onclick="loadFunctionsForOperations()">Загрузить функции</button>
            <div style="display: flex; gap: 0.5rem; margin-top: 1rem; justify-content: center;">
                <button onclick="performOperation('ADD')" title="Сложение">+</button>
                <button onclick="performOperation('SUBTRACT')" title="Вычитание">−</button>
                <button onclick="performOperation('MULTIPLY')" title="Умножение">×</button>
                <button onclick="performOperation('DIVIDE')" title="Деление">÷</button>
            </div>
        </div>
    </section>
</main>

<div id="snackbar"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script>
    checkAuthAndRender();

    async function loadFunctionsForOperations() {
      try {
        const res = await apiFetch('/users/me');
        const user = await res.json();
        const res2 = await apiFetch(`/functions/user/${user.id}`);
        const functions = await res2.json();
        const selectA = document.getElementById('funcA');
        const selectB = document.getElementById('funcB');
        selectA.innerHTML = '';
        selectB.innerHTML = '';
        functions.forEach(f => {
          selectA.innerHTML += `<option value="${f.id}">${f.name}</option>`;
          selectB.innerHTML += `<option value="${f.id}">${f.name}</option>`;
        });
      } catch (e) {
        showSnackbar(e.message || 'Ошибка загрузки функций', 'error');
      }
    }

    async function performOperation(type) {
      const selectA = document.getElementById('funcA');
      const selectB = document.getElementById('funcB');

      const funcA = selectA.value;
      const funcB = selectB.value;

      if (!funcA || !funcB) {
        showSnackbar('Выберите обе функции', 'error');
        return;
      }

      if (isNaN(parseInt(funcA)) || isNaN(parseInt(funcB))) {
        showSnackbar('Некорректный ID функции', 'error');
        return;
      }

      const res = await apiFetch('/users/me');
      const user = await res.json();

      const dto = {
        userId: user.id,
        function1Id: parseInt(funcA),
        function2Id: parseInt(funcB),
        operationType: type
      };

      try {
        const opRes = await apiFetch('/operations', { method: 'POST', body: JSON.stringify(dto) });

        if (!opRes.ok) {
          const errorText = await opRes.text();
          throw new Error(`HTTP ${opRes.status}: ${errorText}`);
        }

        const op = await opRes.json();

        if (!op || !op.resultFunction || typeof op.resultFunction.id !== 'number') {
          throw new Error("Некорректный ответ от сервера: нет resultFunction.id");
        }

        showSnackbar(`Операция выполнена! Результат: ID ${op.resultFunction.id}`, 'success');

      } catch (e) {
        showSnackbar(e.message || 'Ошибка операции', 'error');
      }
    }
</script>
</body>
</html>
