<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Регистрация</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <div class="header-content">
        <div class="header-left">
            <button class="nav-btn" onclick="location.href='login.html'">Войти</button>
        </div>
        <div class="header-center">
            <h1>Регистрация</h1>
        </div>
        <div class="header-right">
            <div class="theme-controls">
                <span class="theme-label">Тёмная тема</span>
                <div id="theme-toggle" class="theme-toggle" title="Переключить тему"></div>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <section class="centered-section">
        <div class="form-section">
            <input type="text" id="username" placeholder="Имя пользователя" required>
            <input type="email" id="email" placeholder="Email" required>
            <input type="password" id="password" placeholder="Пароль" required>
            <button class="centered-button" onclick="register()">Зарегистрироваться</button>
            <div id="error" class="error hidden"></div>
        </div>
    </section>
</main>

<div id="snackbar"></div>

<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
</body>
</html>
