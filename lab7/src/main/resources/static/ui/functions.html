<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Мои функции</title>
    <link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css" />
</head>
<body>
<header>
    <div class="header-content">
        <div class="header-left">
            <button class="back-btn" onclick="location.href='index.html'">Назад</button>
        </div>
        <div class="header-center">
            <h1>Мои функции</h1>
        </div>
        <div class="header-right">
            <div class="theme-controls">
                <span class="theme-label">Тёмная тема</span>
                <div id="theme-toggle" class="theme-toggle"></div>
            </div>
        </div>
    </div>
</header>

<main class="container">
    <section class="centered-section">
        <h2>Создать функцию</h2>
        <div class="form-section">
            <label>Имя: <input id="name" value="Моя функция"></label>
            <label>Тип:
                <select id="type">
                    <option value="BASIC">Основная</option>
                    <option value="COMPOSITE">Композитная</option>
                </select>
            </label>
            <label>Выражение: <input id="expression" value="x*x"></label>
            <label>Левая граница: <input type="number" step="any" id="left" value="0"></label>
            <label>Правая граница: <input type="number" step="any" id="right" value="10"></label>
            <label>Точек: <input type="number" id="points" value="100" min="2"></label>
            <button class="centered-button" onclick="createFunction()">Создать</button>
        </div>
    </section>

    <section class="centered-section">
        <h2>Мои функции</h2>
        <div id="functions-list"></div>
    </section>
</main>

<div id="snackbar"></div>

<script src="js/api.js"></script>
<script src="js/auth.js"></script>
<script src="js/theme.js"></script>
<script src="js/utils.js"></script>
<script src="js/functions-ui.js"></script>
<script>
    checkAuthAndRender();
    loadUserFunctions();
</script>
</body>
</html>
