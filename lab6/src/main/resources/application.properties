spring.datasource.url=jdbc:postgresql://localhost:5432/labsoop_db
spring.datasource.username=postgres
spring.datasource.password=093306
spring.datasource.driver-class-name=org.postgresql.Driver

#spring.jpa.hibernate.ddl-auto=update
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.defer-datasource-initialization=true

server.port=8080

logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.security.web=DEBUG
logging.level.org.springframework.web=DEBUG
logging.level.lab5=DEBUG
logging.level.lab5.config=DEBUG
logging.level.lab5.controller=DEBUG
logging.level.lab5.service=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.springframework.data=INFO